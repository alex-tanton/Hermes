version: '3.8'

services:
  referral-repeater:
    build:
      context: .
      dockerfile: Dockerfile
    image: referral-repeater:latest
    container_name: referral-repeater
    restart: unless-stopped
    init: true
    environment:
      - NODE_ENV=production
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.data:/app/.data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
